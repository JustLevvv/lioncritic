<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/circles.css">
  <title>Lioncritic</title>
  <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="block display_none" id="block"></div>
  <div class="background">
    <ul class="circles">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>
  </div>
  <header class="hat">
    <div class="icon">
      <a href="/index.html" class="home_link">
        <img class="icon_image" src="favicon/android-chrome-192x192.png" width="64" height="64">
        <h1 class="title">ioncritic</h1>
      </a>
    </div>
    <input type="text" id="search_bar" class="search_bar" placeholder="Поиск" spellcheck="false">
    <img src="other_images/cross.svg" class="img_cancel_search_button" onclick="cancelSearch()" width="40">
    <img src="other_images/magnifier.svg" class="img_search_button" onclick="search()" width="40">
    <div class="profile" onclick="profileContext()">
      <p id="profile_text" class="profile_text">Гость</p>
      <p id="profile_number" class="profile_text"></p>
      
    </div>
  </header>
  <main class="main" id="main">
    <div id="search_advice" class="search_advice display_none">
      <p class="search_advice_text">Используйте ключи через пробел:</p>
      <p class="search_advice_text">dev: genre: date:гггг-мм-дд unrated:1/0 order:gameplay/graphics/story/sound/date</p>
    </div>
    <button class="add_game_button menu_button" id="menu_button" onclick="menu()">Меню ◀</button>
    <div class="menu display_none" id="menu">
      <button class="add_game_button menu_button" id="menu_1" onclick="location.href='stats.html'">Статистика</button>
      <div class="moderator_tools display_none" id="moderator_tools">
        <p class="you_mod" id="menu_2">Вы модератор</p>
        <button class="add_game_button" id="menu_3" onclick="location.href='addGame.html'">Добавить игру</button>
        <button class="add_game_button" id="menu_4">Удалить игры</button>
        <div class="superadmin_tools display_none" id="superadmin_tools">
          <p class="you_mod" id="menu_5">Вы суперадмин</p>
          <button class="user_manager_button" id="menu_6" onclick="location.href='userManager.html'">Менеджер пользователей</button>
        </div>
      </div>
    </div>
    <div class="guest_context_box display_none" id="guest_context_box">
      <input type="text" id="login_username" class="profile_context_bar" placeholder="Логин" spellcheck="false">
      <input type="password" id="login_password" class="profile_context_bar" placeholder="Пароль" spellcheck="false">
      <button onclick="login()" class="profile_context_bar">Вход</button>
      <button onclick="setRegister()" class="profile_context_bar">Регистрация</button>
    </div>
    <div class="register_context_box display_none" id="register_context_box">
      <input type="text" id="register_username" class="profile_context_bar" placeholder="Логин" spellcheck="false">
      <input type="password" id="register_password" class="profile_context_bar" placeholder="Пароль" spellcheck="false">
      <input type="password" id="register_password_repeat" class="profile_context_bar" placeholder="Повторите пароль" spellcheck="false">
      <input type="email" id="register_email" class="profile_context_bar" placeholder="Почта" spellcheck="false">
      <button onclick="register()" class="profile_context_bar">Зарегистрироваться</button>
      <button onclick="setLogin()" class="profile_context_bar">Отмена</button>
    </div>
    <div class="authorized_context_box display_none" id="authorized_context_box">
      <button onclick="location.href='profile.html'" class="profile_context_bar">Профиль</button>
      <button onclick="logout()" class="profile_context_bar">Выйти из аккаунта</button>
    </div>
    <div class="games_grid" id="games_grid">
    </div>
    <button class="go_up_button display_none" id="go_up_button" onclick="goUp()">▲</button>
  </main>
  <div class="notification display_none" id="notification">
    <p id="notification_text">Уведомление!</p>
    <button id="notification_button" class="notification_button">OK</button>
  </div>


  <script src="scripts/client.js"></script>
</body>
</html>
